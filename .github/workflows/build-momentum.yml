name: Build Momentum Android 5+
on:
  push:
    branches: [ momentum-android5-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify API compatibility
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|sdkVersion|targetSdkVersion"
      - uses: actions/upload-artifact@v4
        with:
          name: Momentum-Android5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
