name: Build UHD730 VirtIO Driver

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK build tools
        shell: powershell
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $vsInstaller modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Component.Microsoft.Windows.DriverKit.BuildTools `
            --add Microsoft.VisualStudio.Component.Windows11SDK.26100 `
            --quiet `
            --norestart
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            exit $LASTEXITCODE
          }

      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build viogpu Win10 x64
        shell: cmd
        run: |
          call build\build.bat viogpu\viogpu.sln "Win10" amd64

      - name: Find driver
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter viogpudo.sys
          Get-ChildItem -Recurse -Filter viogpudo.inf
          Get-ChildItem -Recurse -Filter viogpudo.cat

      - name: Collect UHD730 driver
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact

          $sys = Get-ChildItem -Recurse -Filter viogpudo.sys | Select-Object -First 1
          $inf = Get-ChildItem -Recurse -Filter viogpudo.inf | Select-Object -First 1
          $cat = Get-ChildItem -Recurse -Filter viogpudo.cat | Select-Object -First 1

          if (-not $sys) { throw "viogpudo.sys not found" }
          if (-not $inf) { throw "viogpudo.inf not found" }

          Copy-Item $sys.FullName artifact\
          Copy-Item $inf.FullName artifact\

          if ($cat) {
            Copy-Item $cat.FullName artifact\
          }

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: Intel-UHD730-VirtIO-Win10-x64
          path: artifact
