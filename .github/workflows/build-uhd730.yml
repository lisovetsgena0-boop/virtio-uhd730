name: Build Signed UHD730 VirtIO Driver

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK build tools
        shell: powershell
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          & $vsInstaller modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Component.Microsoft.Windows.DriverKit.BuildTools `
            --add Microsoft.VisualStudio.Component.Windows11SDK.26100 `
            --quiet `
            --norestart

          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            exit $LASTEXITCODE
          }

      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build viogpu
        shell: cmd
        run: |
          call build\build.bat viogpu\viogpu.sln "Win10" amd64

      - name: Sign UHD730 driver package
        shell: powershell
        run: |
          $sys = Get-ChildItem -Recurse -Filter viogpudo.sys |
                 Where-Object { $_.FullName -match 'amd64|x64' } |
                 Select-Object -First 1

          if (-not $sys) {
            throw "viogpudo.sys not found"
          }

          $dir = $sys.Directory.FullName
          $inf = Join-Path $dir "viogpudo.inf"
          $cat = Join-Path $dir "viogpudo.cat"

          if (-not (Test-Path $inf)) {
            throw "viogpudo.inf not found"
          }

          Write-Host "Driver directory: $dir"

          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          $inf2cat = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter Inf2Cat.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          if (-not $inf2cat) {
            throw "Inf2Cat.exe not found"
          }

          Write-Host "SignTool: $($signtool.FullName)"
          Write-Host "Inf2Cat:  $($inf2cat.FullName)"

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=UHD730 VirtIO Test Driver" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(5)

          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

          New-Item -ItemType Directory -Force artifact | Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath artifact\UHD730-Test.cer | Out-Null

          # Sign SYS first
          & $signtool.FullName sign `
            /v `
            /fd SHA256 `
            /sha1 $cert.Thumbprint `
            $sys.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "SYS signing failed"
          }

          # Old catalog is now invalid because SYS changed.
          if (Test-Path $cat) {
            Remove-Item $cat -Force
          }

          # Generate a NEW catalog from the signed SYS + INF
          & $inf2cat.FullName `
            /driver:"$dir" `
            /os:10_X64

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed"
          }

          if (-not (Test-Path $cat)) {
            throw "New viogpudo.cat not generated"
          }

          # Sign new catalog
          & $signtool.FullName sign `
            /v `
            /fd SHA256 `
            /sha1 $cert.Thumbprint `
            $cat

          if ($LASTEXITCODE -ne 0) {
            throw "CAT signing failed"
          }

          Copy-Item $sys.FullName artifact\viogpudo.sys
          Copy-Item $inf artifact\viogpudo.inf
          Copy-Item $cat artifact\viogpudo.cat

          Write-Host "=== FINAL PACKAGE ==="
          Get-ChildItem artifact

      - name: Check UHD730 ID
        shell: powershell
        run: |
          if (-not (Select-String `
              -Path artifact\viogpudo.inf `
              -Pattern 'PCI\\VEN_8086&DEV_4682')) {
            throw "PCI 8086:4682 missing from INF"
          }

      - name: Upload signed driver
        uses: actions/upload-artifact@v4
        with:
          name: Intel-UHD730-VirtIO-SIGNED-Win10-x64
          path: artifact
