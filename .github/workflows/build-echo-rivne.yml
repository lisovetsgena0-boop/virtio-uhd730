name: Build ECHO RIVNE APK

on:
  push:
    branches:
      - echo-rivne-build
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Android APK with Godot 3.5.3
        uses: dulvui/godot-android-export@v3.0.0
        with:
          working-directory: echo-rivne-src
          godot-version: 3.5.3

      - name: Find APK
        shell: bash
        run: |
          set -euxo pipefail
          find echo-rivne-src -type f -name '*.apk' -print
          APK=$(find echo-rivne-src -type f -name '*.apk' | head -n1)
          test -n "$APK"
          test -s "$APK"
          cp "$APK" ./ECHO_RIVNE.apk
          ls -lh ./ECHO_RIVNE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECHO_RIVNE_APK
          path: ECHO_RIVNE.apk
          if-no-files-found: error
