name: Build ECHO RIVNE APK

on:
  push:
    branches:
      - echo-rivne-build
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-31" "build-tools;30.0.3"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Download official Godot 3.5.3 headless and templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v3.5.3-stable_linux_headless.64
          rm -rf /tmp/templates && mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/templates/3.5.3.stable"
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/templates/3.5.3.stable/"
          /tmp/godot/Godot_v3.5.3-stable_linux_headless.64 --version

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-3.tres" <<EOF
          [gd_resource format=2]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p echo-rivne-src/build
          /tmp/godot/Godot_v3.5.3-stable_linux_headless.64 --path echo-rivne-src --verbose --export-debug "Android" "$(pwd)/echo-rivne-src/build/ECHO_RIVNE.apk"
          test -s echo-rivne-src/build/ECHO_RIVNE.apk
          cp echo-rivne-src/build/ECHO_RIVNE.apk ./ECHO_RIVNE.apk
          file ./ECHO_RIVNE.apk
          unzip -t ./ECHO_RIVNE.apk
          ls -lh ./ECHO_RIVNE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECHO_RIVNE_APK
          path: ECHO_RIVNE.apk
          if-no-files-found: error
