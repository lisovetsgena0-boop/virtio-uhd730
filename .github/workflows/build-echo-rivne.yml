name: Build ECHO RIVNE APK

on:
  push:
    branches:
      - echo-rivne-build
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5.2
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Android APK
        working-directory: echo-rivne-src
        run: |
          mkdir -p build
          godot --version
          godot -v --export-debug "Android" build/ECHO_RIVNE.apk
          test -s build/ECHO_RIVNE.apk
          ls -lh build/ECHO_RIVNE.apk

      - name: Copy artifact to workspace root
        run: cp echo-rivne-src/build/ECHO_RIVNE.apk ./ECHO_RIVNE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECHO_RIVNE_APK
          path: ECHO_RIVNE.apk
          if-no-files-found: error
