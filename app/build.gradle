plugins {
    id 'com.android.application'
}

android {
    namespace 'com.momentum.liferpg'
    compileSdk 35

    defaultConfig {
        applicationId "com.momentum.liferpg"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
